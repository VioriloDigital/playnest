name: Build PlayNest APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync to Android
        run: pnpm cap:sync

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload PlayNest APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayNest-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Public download link that always points to the newest build:
      # https://github.com/VioriloDigital/playnest/releases/latest/download/PlayNest.apk
      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PlayNest.apk
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PlayNest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlayNest APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Εγκατάσταση στο Android: κατέβασε το PlayNest.apk και άνοιξέ το. Build από ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." \
            --latest
