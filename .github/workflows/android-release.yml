name: Build PlayNest for Google Play

# Manual: builds the signed Android App Bundle (.aab) to upload in Play Console.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync to Android
        run: pnpm cap:sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYNEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PLAYNEST_KEYSTORE_BASE64 is required: Play Console only accepts bundles signed with the upload key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/playnest.jks"
          echo "PLAYNEST_KEYSTORE_FILE=$RUNNER_TEMP/playnest.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android
        env:
          PLAYNEST_KEYSTORE_PASSWORD: ${{ secrets.PLAYNEST_KEYSTORE_PASSWORD }}
        run: |
          export PLAYNEST_VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "versionCode $PLAYNEST_VERSION_CODE" | tee -a "$GITHUB_STEP_SUMMARY"
          ./gradlew --no-daemon bundleRelease

      - name: Check the bundle signature
        run: |
          jarsigner -verify -verbose:summary android/app/build/outputs/bundle/release/app-release.aab | tail -3
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -m1 "SHA256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: PlayNest-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
