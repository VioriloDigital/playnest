name: Build PlayNest iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync to iOS
        run: pnpm build && npx cap sync ios

      - name: Build for iPhone Simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            build

      - name: Package simulator app
        working-directory: build
        run: zip -r PlayNest-iOS-Simulator.zip App.app

      - name: Upload PlayNest iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayNest-iOS-Simulator
          path: build/PlayNest-iOS-Simulator.zip
          if-no-files-found: error
